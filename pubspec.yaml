name: learn_english_app
description: Learn English App

publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ============================================
  # STATE MANAGEMENT & ARCHITECTURE
  # ============================================
  # BLoC pattern for state management
  flutter_bloc: ^9.1.1
  # Provider for dependency injection (legacy support)
  provider: ^6.1.5+1
  
  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0
  injectable_generator: ^2.5.0
  
  # Functional programming utilities
  fpdart: ^1.1.1


  top_snackbar_flutter: ^3.3.0


  # ============================================
  # NETWORKING & API
  # ============================================
  # HTTP client for API communication
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
  pretty_dio_logger: ^1.4.0
  
  # JWT token handling
  jwt_decoder: ^2.0.1
  
  # Network connectivity monitoring
  connectivity_plus: ^6.1.3

  # ============================================
  # LOCAL STORAGE & PERSISTENCE
  # ============================================
  # Key-value storage
  shared_preferences: ^2.5.2
  # Secure storage for sensitive data
  flutter_secure_storage: ^9.2.4
  # File system paths
  path_provider: ^2.1.5
  
  # Sqlite databases
  sqflite: ^2.4.2
  share_plus: ^12.0.0


  badges: ^3.1.2
  flutter_datawedge: ^3.2.0

  # ============================================
  # FIREBASE SERVICES
  # ============================================
  # Firebase core
  firebase_core: ^3.14.0
  # Cloud Firestore database
  cloud_firestore: ^5.6.9
  # Analytics and tracking
  firebase_analytics: ^11.4.4
  # Crash reporting
  firebase_crashlytics: ^4.3.10
  # Push notifications
  firebase_messaging: ^15.2.4
  # Remote configuration
  firebase_remote_config: ^5.4.7
  # Local notifications
  flutter_local_notifications: ^19.0.0

  # ============================================
  # UI COMPONENTS & STYLING
  # ============================================
  # Material icons
  cupertino_icons: ^1.0.8
  # Icon library (FontAwesome, LineAwesome, etc.)
  icons_plus: ^5.0.0
  # Loading animations
  flutter_spinkit: ^5.2.1
  # Shimmer loading effect
  shimmer: ^3.0.0
  # Lottie animations
  lottie: ^3.3.1
  # Google Fonts
  google_fonts: ^8.0.2
  # Responsive UI sizing
  flutter_screenutil: ^5.9.3
  shorebird_code_push: ^2.0.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  # SVG rendering — used by SentenceTopicIllustration for ph_*.svg assets.
  flutter_svg: ^2.2.0


  # ============================================
  # NAVIGATION & ROUTING
  # ============================================
  # Declarative routing
  go_router: ^16.2.4
  # Deep linking
  app_links: ^6.4.0

  # ============================================
  # MEDIA & SCANNING
  # ============================================
  # Barcode scanning
  ai_barcode_scanner: ^7.1.0
  # Camera access
  camera: ^0.11.2
  permission_handler: ^11.4.0

  # ============================================
  # UTILITIES
  # ============================================
  # Internationalization
  intl: ^0.20.2
  # Phone number input
  intl_phone_number_input: ^0.7.4
  
  # Environment variables
  flutter_dotenv: ^6.0.0
  envied: ^1.3.1
  # File path helpers
  path: ^1.9.0
  
  # URL launcher
  url_launcher: ^6.3.1
  # Share functionality

  # Reactive extensions
  rxdart: ^0.27.1
  # Dart extensions
  dartx: ^1.2.0
  # Collection utilities
  collection: ^1.19.0
  # Async utilities
  async: ^2.11.0
  
  # UUID generation
  uuid: ^4.5.1
  # Package info
  package_info_plus: ^8.3.0
  
  # Scrollable positioned list
  scrollable_positioned_list: ^0.3.8
  
  # Value equality
  equatable: ^2.0.7

  audioplayers: ^6.5.1
  flutter_tts: ^4.2.2
  # Speech-to-text for pronunciation practice
  speech_to_text: ^7.0.0
  # Microphone recording for the "hear your own voice" playback button.
  # Runs alongside speech_to_text — see SpeechRecognitionService for the
  # parallel-session design (TASK 12).
  #
  # Pinned to 5.1.2 (not ^5.0.0). The 5.2.x line bumps
  # record_platform_interface to 1.6.0 (adds startStream + a new
  # hasPermission signature), but record_linux 0.7.2 — the latest Linux
  # platform plugin — still extends the old interface, so pub resolves a
  # combination that won't compile. 5.1.2's platform plugins are all in
  # sync; drop the pin as soon as record_linux gets a 1.6-compatible
  # release.
  record: 5.1.2
  crypto: ^3.0.6
  # ============================================
  # CODE GENERATION & SERIALIZATION
  # ============================================
  # JSON serialization
  json_annotation: ^4.9.0
  # Immutable data classes
  freezed_annotation: ^3.0.0

# ============================================
# DEVELOPMENT DEPENDENCIES
# ============================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting rules
  flutter_lints: any
  
  # Code generation
  build_runner: ^2.4.13
  json_serializable: ^6.6.2
  freezed: ^3.0.0
  envied_generator: ^1.1.1
  
  # Asset generation
  flutter_gen: ^5.3.1
  
  # Logging
  logging: ^1.3.0

  # In-memory SQLite for tests
  sqflite_common_ffi: ^2.3.4

  # BLoC testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

# ============================================
# DEPENDENCY OVERRIDES
# ============================================
# `record` 5.1.2's constraint on record_linux resolves to 0.7.2, an older
# release that extends an older RecordPlatform and so lacks the
# `startStream` method the current interface requires. The kernel
# snapshot aborts with a missing-method error on every build — iOS and
# Android included, because Dart's analyzer compiles the Dart source of
# every plugin in the graph regardless of the target platform.
# record_linux 1.2.1 IS up to date; the override forces it despite the
# record facade's older constraint. Drop this once record tightens its
# record_linux dependency range.
dependency_overrides:
  record_linux: ^1.2.1

# ============================================
# FLUTTER CONFIGURATION
# ============================================
flutter:
  generate: true
  uses-material-design: true

  # Asset directories
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/sounds/
    - assets/google_fonts/
    - assets/databases/learn_db.db
#    - shorebird.yaml

  # Bundled font families — referenced from BayanTypography by family name.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BeVietnamPro/BeVietnamPro-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter/Inter_18pt-Black.ttf
          weight: 900
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
